<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      color: #1a1a1a;
      background:
        radial-gradient(circle at top left, #dce9f5 0%, transparent 45%),
        radial-gradient(circle at bottom right, #f3e7d3 0%, transparent 40%),
        #f7f5f1;
      padding: 2rem;
    }

    main {
      text-align: center;
      max-width: 28rem;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 4rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }

    p {
      font-family: "Segoe UI", Tahoma, sans-serif;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #444;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello</h1>
    <p>This is a simple HTML page. Open it in your browser to view it.</p>
  </main>
</body>
</html>
